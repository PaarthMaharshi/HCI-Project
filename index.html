    <title>Paarth Maharshi</title>
    <script>
      // Apply saved prefs before first paint so the theme doesn't flash.
      // Light is the default; dark only when the visitor picked it.
      try {
        var p = JSON.parse(localStorage.getItem("hci-prefs") || "{}");
        var d = document.documentElement;
        d.dataset.theme = p.theme === "dark" ? "dark" : "light";
        if (p.largeText) d.dataset.text = "large";
        // ?motion=on keeps animations even when the OS asks for reduced motion.
        var m = new URLSearchParams(location.search).get("motion");
        if (m === "on" || m === "off") localStorage.setItem("hci-motion", m);
        if (localStorage.getItem("hci-motion") === "on") d.dataset.motion = "on";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
